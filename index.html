<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="LAST SEARCH">
  <title>LAST SEARCH</title>

  <style>
    :root { --bg:#050505; --text:#f1f1f1; --muted:#555; --line:#2a2a2a; }
    * { box-sizing:border-box; }
    html,body {
      margin:0; min-height:100%; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    }
    body { min-height:100dvh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .login-status {
      display:none; position:fixed; top:18px; right:20px; z-index:5;
      padding:8px 10px; border:0; background:transparent; color:#666;
      font:inherit; font-size:12px; letter-spacing:.08em; cursor:default; user-select:none;
    }
    .login-status.visible { display:block; }
    .page { width:min(760px,calc(100% - 32px)); transform:translateY(-6vh); }
    .brand { margin-bottom:42px; text-align:center; user-select:none; }
    .brand h1 {
      margin:0; color:#f3f3f3; font-size:clamp(2.3rem,8vw,4.8rem);
      font-weight:600; letter-spacing:.18em; text-indent:.18em;
    }
    .search-box {
      display:flex; align-items:center; width:100%; min-height:58px;
      background:#0a0a0a; border:1px solid var(--line); border-radius:4px;
    }
    .search-box:focus-within { border-color:#505050; background:#0c0c0c; }
    .search-icon { flex:0 0 auto; width:20px; height:20px; margin-left:18px; opacity:.45; }
    .search-input {
      flex:1; min-width:0; height:58px; padding:0 14px; border:0; outline:0;
      background:transparent; color:#e7e7e7; font-size:16px; caret-color:#aaa;
    }
    .search-input::placeholder { color:#454545; }
    .search-button {
      flex:0 0 auto; min-width:74px; height:44px; margin-right:7px; padding:0 16px;
      border:1px solid #292929; border-radius:3px; background:#111; color:#aaa;
      font-size:13px; cursor:pointer;
    }
    .search-button:active { transform:translateY(1px); }
    .status {
      min-height:24px; margin-top:14px; text-align:center; color:#444;
      font-size:12px; letter-spacing:.06em; opacity:0; transition:opacity 180ms ease;
    }
    .status.visible { opacity:1; }
    .veil {
      position:fixed; inset:0; z-index:20; pointer-events:none;
      background:rgba(0,0,0,0); transition:background 420ms ease;
    }
    .veil.on { background:rgba(0,0,0,.96); }
    @media (max-width:520px) {
      .page { width:calc(100% - 26px); transform:translateY(-8vh); }
      .brand { margin-bottom:34px; }
      .brand h1 { font-size:clamp(2rem,12vw,3.5rem); letter-spacing:.13em; text-indent:.13em; }
      .search-button { min-width:64px; padding:0 12px; }
      .login-status { top:10px; right:10px; }
    }
  </style>
</head>
<body>
  <button id="loginStatus" class="login-status" type="button" tabindex="-1">ログイン中</button>
  <div id="veil" class="veil"></div>

  <main class="page">
    <section class="brand" aria-label="LAST SEARCH"><h1>LAST SEARCH</h1></section>
    <form id="searchForm" autocomplete="off">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.5"></circle>
          <path d="M16 16L21 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>
        <input id="searchInput" class="search-input" type="search" maxlength="120" placeholder="検索..." aria-label="検索">
        <button class="search-button" type="submit">検索</button>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    /*
      CASE 003は不正アクセス専用なので通常抽選には入れない。
      CASE 001 / 002へ正規遷移する直前に sessionStorage の
      ls_entry_case を設定する。
    */
    const CASES = [
      { id:"001", path:"./cases/case-001/", weight:100, enabled:true, minSearchCount:1 },
      { id:"002", path:"./cases/case-002/", weight:100, enabled:true, minSearchCount:1 },
      { id:"005", path:"./cases/case-005/", weight:100, enabled:true, minSearchCount:1 }
    ];

    const CASE004_PATH = "./cases/case-004/";

    function normalizeQuery(value){
      return value
        .trim()
        .replace(/[\s　]+/g,"")
        .replace(/くがあきら/g,"久我あきら");
    }

    function isKugaQuery(value){
      return normalizeQuery(value) === "久我あきら";
    }

    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const status = document.getElementById("status");
    const veil = document.getElementById("veil");
    const loginStatus = document.getElementById("loginStatus");

    function readNumber(key,fallback=0){
      const value=Number(localStorage.getItem(key));
      return Number.isFinite(value)?value:fallback;
    }
    function readSeenCases(){
      try {
        const parsed=JSON.parse(localStorage.getItem("ls_seen_cases")||"[]");
        return Array.isArray(parsed)?parsed:[];
      } catch { return []; }
    }
    function saveSeenCases(cases){ localStorage.setItem("ls_seen_cases",JSON.stringify(cases)); }
    function isTrue(key){ return localStorage.getItem(key)==="true"; }
    function updateLoginStatus(){
      if(isTrue("ls_case_001_complete")) loginStatus.classList.add("visible");
    }
    function weightedRandom(items){
      if(!items.length) return null;
      const total=items.reduce((sum,item)=>sum+Math.max(0,Number(item.weight)||0),0);
      if(total<=0) return items[Math.floor(Math.random()*items.length)];
      let roll=Math.random()*total;
      for(const item of items){
        roll-=Math.max(0,Number(item.weight)||0);
        if(roll<=0) return item;
      }
      return items[items.length-1];
    }
    function chooseCase(searchCount,seenCases){
      const eligible=CASES.filter(item=>item.enabled && searchCount>=(item.minSearchCount||0));
      if(!eligible.length) return null;
      const unseen=eligible.filter(item=>!seenCases.includes(item.id));
      return weightedRandom(unseen.length?unseen:eligible);
    }
    function saveSearchState(query,selectedCase){
      const searchCount=readNumber("ls_search_count")+1;
      const seenCases=readSeenCases();
      localStorage.setItem("ls_search_count",String(searchCount));
      localStorage.setItem("ls_last_query",query);
      if(!localStorage.getItem("ls_first_visit")) localStorage.setItem("ls_first_visit",String(Date.now()));
      if(selectedCase && !seenCases.includes(selectedCase.id)){
        seenCases.push(selectedCase.id);
        saveSeenCases(seenCases);
      }
      return searchCount;
    }
    function showStatus(message){
      status.textContent=message;
      status.classList.add("visible");
    }

    searchForm.addEventListener("submit",event=>{
      event.preventDefault();
      const query=searchInput.value.trim();
      if(!query){ searchInput.focus(); return; }

      // 「久我あきら」はランダム抽選より優先してCASE004へ。
      if(isKugaQuery(query)){
        localStorage.setItem("ls_last_query",query);
        localStorage.setItem("ls_search_count",String(readNumber("ls_search_count")+1));
        sessionStorage.setItem("ls_entry_case","004");

        showStatus("検索しています");
        setTimeout(()=>veil.classList.add("on"),420);
        setTimeout(()=>{ window.location.href=CASE004_PATH; },900);
        return;
      }

      const nextSearchCount=readNumber("ls_search_count")+1;
      const seenCases=readSeenCases();
      const selectedCase=chooseCase(nextSearchCount,seenCases);

      saveSearchState(query,selectedCase);

      if(!selectedCase){
        showStatus("検索結果が見つかりませんでした");
        return;
      }

      sessionStorage.setItem("ls_entry_case", selectedCase.id);

      showStatus("検索しています");
      setTimeout(()=>veil.classList.add("on"),420);
      setTimeout(()=>{ window.location.href=selectedCase.path; },900);
    });

    window.addEventListener("load",()=>{
      // TOPに戻った時点でCASE内のactive状態は終了。
      sessionStorage.removeItem("ls_case_001_active");
      sessionStorage.removeItem("ls_case_002_active");
      sessionStorage.removeItem("ls_case_004_active");
      sessionStorage.removeItem("ls_case_005_active");
      sessionStorage.removeItem("ls_entry_case");

      updateLoginStatus();

      // CASE004直後だけ、右上の「ログイン中」を10秒間「久我あきら」に変える。
      const flashAt = Number(localStorage.getItem("ls_case_004_flash_name") || 0);
      if (flashAt && Date.now() - flashAt < 15000) {
        loginStatus.classList.add("visible");
        loginStatus.textContent = "久我あきら";
        setTimeout(() => {
          loginStatus.textContent = "ログイン中";
          localStorage.removeItem("ls_case_004_flash_name");
        }, 10000);
      }

      const pendingQuery=localStorage.getItem("ls_pending_query");
      if(pendingQuery){
        searchInput.value=pendingQuery;
        localStorage.removeItem("ls_pending_query");
      }
      setTimeout(()=>searchInput.focus(),250);
    });
  </script>
</body>
</html>
