<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f1">
  <title>CASE 009 | LAST SEARCH</title>
  <link rel="stylesheet" href="./case.css">
</head>
<body>
<main class="page">
  <section class="panel" id="panel" aria-live="polite">
    <header class="head">
      <div class="brand">LAST SEARCH</div>
      <div class="case-no">CASE 009</div>
    </header>

    <div class="content">
      <p class="eyebrow">OGATAKA / 2009.09.17</p>
      <h1>一家4名所在不明</h1>
      <p class="intro">小形高地区の保存写真が見つかりました。</p>

      <figure id="photoCard" class="photo-card">
        <div class="photo-stage">
          <img id="photo" src="./img/family-01.png" alt="">
          <div id="flash" class="flash"></div>
        </div>
        <figcaption>
          <span id="stamp">2009/09/17 02:54</span>
          <b id="count">4名</b>
        </figcaption>
      </figure>

      <div class="status-box">
        <span>記録状態</span>
        <b id="status">確認中</b>
      </div>

      <p id="message" class="message">保存写真を照合しています。</p>
      <button id="next" class="primary" type="button" hidden>「OFFLINE」を検索する</button>
    </div>
  </section>
</main>

<script src="./case.js"></script>
</body>
</html>
