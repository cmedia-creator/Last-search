<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ea">
  <title>LAST SEARCH</title>
  <link rel="stylesheet" href="./case.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <a class="logo" href="../../" aria-label="LAST SEARCH">LAST SEARCH</a>
      <form id="searchForm" class="search" autocomplete="off">
        <input id="searchInput" type="search" maxlength="120" aria-label="検索">
        <button type="submit">検索</button>
      </form>
    </header>

    <section id="dataNotice" class="data-notice" hidden>
      <p id="dataNoticeText"></p>
    </section>

    <section class="results-head">
      <div id="resultMeta" class="result-meta"></div>
      <h1 id="resultTitle">検索結果</h1>
    </section>

    <section id="historyPanel" class="history-panel" hidden>
      <div class="history-title">最近の検索</div>
      <div id="historyRows"></div>
      <div id="syncMessage" class="sync-message" aria-live="polite"></div>
    </section>

    <section class="results">
      <article class="result">
        <a href="./record-09-17.html">記録番号 09-17 / 保全済</a>
        <div class="url">archive.local / record / 09-17</div>
        <p>公開終了したページの記録。本文のみ保存されています。</p>
      </article>

      <article class="result">
        <a href="./transfer-record.html">転出記録について</a>
        <div class="url">archive.local / transfer / 2009</div>
        <p>2009年に保存された個人ページ。内容の正確性は確認されていません。</p>
      </article>
    </section>

    <section id="finalSearch" class="final-search" hidden>
      <p>検索を続ける</p>
      <form id="finalSearchForm" autocomplete="off">
        <input id="finalSearchInput" type="search" value="小形高" aria-label="検索">
        <button type="submit">検索</button>
      </form>
    </section>
  </main>

  <script src="./case.js"></script>
</body>
</html>
