<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f1">
  <title>LAST SEARCH - CASE 001</title>

  <!-- LAST SEARCH 共通UI -->
  <link rel="stylesheet" href="../../assets/css/last-search.css">

  <!-- CASE 001 固有UI -->
  <link rel="stylesheet" href="./case.css">
</head>

<body>
  <main class="wrap" id="app">
    <div class="brand">
      LAST SEARCH
      <small>CASE 001 / VERIFY</small>
    </div>

    <section class="card" aria-label="画像認証">
      <div class="head">
        <h1>画像認証</h1>
        <p>続行するには、人間であることを確認してください。</p>
      </div>

      <div class="challenge" id="challenge">
        <div class="prompt" id="prompt"></div>
        <div class="grid" id="grid" aria-live="polite"></div>
      </div>

      <div class="status" id="status" aria-live="polite"></div>

      <div class="actions">
        <button class="ctrl" id="resetBtn" type="button">やり直す</button>
        <button class="ctrl primary" id="verifyBtn" type="button">確認</button>
      </div>
    </section>
  </main>

  <!-- 共通 localStorage -->
  <script src="../../assets/js/storage.js"></script>

  <!-- CASE 001 本体 -->
  <script src="./case.js"></script>
</body>
</html>
