<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F4F4F1">
  <title>CASE 001 | LAST SEARCH</title>
  <link rel="stylesheet" href="./case.css">
</head>
<body>
  <main class="page">
    <section class="captcha" aria-live="polite">
      <div class="captcha-head">
        <div class="brand">LAST SEARCH</div>
        <div class="case-no">CASE 001</div>
      </div>

      <div id="prompt" class="prompt">画像認証を読み込んでいます...</div>
      <div id="grid" class="grid" aria-label="画像認証"></div>

      <div class="actions">
        <div id="status" class="status"></div>
        <button id="verify" class="verify" type="button">確認</button>
      </div>
    </section>

    <section id="complete" class="complete" hidden>
      <div class="complete-inner">
        <div class="spinner" aria-hidden="true"></div>
        <p>本人確認が完了しました。</p>
      </div>
    </section>
  </main>

  <script src="./case.js"></script>
</body>
</html>
