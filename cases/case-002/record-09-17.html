  <p>九月十七日</p>

  <p>四人とも家にはいなかった。<br>ただし靴は残っていた。</p>

  <p>父のものが二足。<br>
  母のものが一足。<br>
  子供のものが三足。</p>

  <p>数が合わない。</p>

  <p>玄関には濡れた跡があった。<br>
  雨は降っていなかった。</p>

  <p>電話は午後十一時二十六分に鳴った。<br>
  誰も出なかった。</p>

  <p>翌朝、受話器だけが床に置かれていた。</p>

  <p>この記録を書いた人間は、家の中には入っていない。</p>

  <p class="question">では、なぜ受話器が床にあったことを知っている？</p>
