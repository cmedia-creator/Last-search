<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F4F4F1">
  <title>CASE 002 | LAST SEARCH</title>
  <link rel="stylesheet" href="./case.css">
</head>
<body>
  <main class="page">
    <section class="panel" id="panel">
      <header class="head">
        <div class="brand">LAST SEARCH</div>
        <div class="case-no">CASE 002</div>
      </header>

      <div class="content">
        <p class="eyebrow">人物状態照合</p>

        <h1>久我あきら</h1>

        <dl class="record" id="record">
          <div>
            <dt>識別状態</dt>
            <dd>照合済み</dd>
          </div>
          <div>
            <dt>最終確認</dt>
            <dd id="lastSeen">00:28</dd>
          </div>
          <div>
            <dt>状態</dt>
            <dd id="lifeStatus" class="alive">生存</dd>
          </div>
        </dl>

        <div class="source-box" id="sourceBox" hidden>
          <div class="source-line"><span>通信</span><b id="src1">確認中</b></div>
          <div class="source-line"><span>金融</span><b id="src2">確認中</b></div>
          <div class="source-line"><span>医療</span><b id="src3">確認中</b></div>
          <div class="source-line"><span>所在</span><b id="src4">確認中</b></div>
        </div>

        <p class="message" id="message">最新状態を確認できます。</p>

        <button id="checkButton" class="primary" type="button">状態を更新</button>
      </div>
    </section>

    <section class="death-screen" id="deathScreen" hidden aria-live="assertive">
      <div class="death-inner">
        <div class="death-time">00:29</div>
        <div class="death-name">久我あきら</div>
        <div class="death-status">死亡</div>
      </div>
    </section>
  </main>

  <script src="./case.js"></script>
</body>
</html>
