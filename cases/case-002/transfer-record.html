<main class="document">
  <div class="stamp">2009 / ARCHIVED TEXT</div>
  <h1>転出記録について</h1>

  <p>四名の転出先について問い合わせを行った。</p>

  <p>一人目。<br>記録あり。</p>
  <p>二人目。<br>記録あり。</p>
  <p>三人目。<br>記録あり。</p>
  <p>四人目。<br>記録あり。</p>

  <p>ただし四名とも、転出届を提出した自治体が異なる。</p>

  <p>同じ日の同じ時刻に受理されている。</p>

  <p class="time">受付時刻<br><strong>15時42分</strong></p>

  <p>四つの自治体の距離を考えると、本人が提出した可能性はない。</p>

  <p>代理人氏名はいずれも記録されていない。</p>

  <p>備考欄には同じ文字列が残っていた。</p>

  <p class="verified">「本人確認済」</p>

  <p>誰が確認したのかは記録されていない。</p>

  <p class="back"><a href="./index.html">← 検索結果へ戻る</a></p>
