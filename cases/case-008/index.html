<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f1">
  <title>CASE 008 | LAST SEARCH</title>
  <link rel="stylesheet" href="./case.css">
</head>
<body>
<main class="page">
  <section class="panel" id="panel" aria-live="polite">
    <header class="head">
      <div class="brand">LAST SEARCH</div>
      <div class="case-no">CASE 008</div>
    </header>

    <div class="content">
      <p class="eyebrow">REFERENCE / SOURCE UNKNOWN</p>
      <h1>OGOTAKA</h1>

      <div id="wordStage" class="word-stage">
        <div id="word" class="word">OGOTAKA</div>
        <div id="cursor" class="cursor">|</div>
      </div>

      <div id="resultCard" class="result-card" hidden>
        <span>検索結果</span>
        <strong>小形高</strong>
        <small>OGATAKA</small>
      </div>

      <div id="judgement" class="judgement" hidden>
        <span id="judgeLabel">一致</span>
      </div>

      <div id="referenceBox" class="reference-box" hidden>
        <span>参照先</span>
        <b id="referenceTarget">確認中</b>
      </div>

      <p id="message" class="message">文字列を確認しています。</p>
      <button id="continueButton" class="primary" type="button" hidden>小形高を検索する</button>
    </div>
  </section>
</main>
<script src="./case.js"></script>
</body>
</html>
