<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F4F4F1">
  <title>CASE 006 | LAST SEARCH</title>
  <link rel="stylesheet" href="./case.css">
</head>
<body>
  <main class="page">
    <section class="panel">
      <header class="head">
        <div class="brand">LAST SEARCH</div>
        <div class="case-no">CASE 006</div>
      </header>

      <div class="content">
        <p class="eyebrow">RELATED IMAGE SEARCH</p>
        <h1>2009</h1>
        <p id="intro" class="intro">関連する画像記録を照合しています。</p>

        <div id="viewer" class="viewer" hidden>
          <img id="photo" src="" alt="">
          <div class="overlay">
            <div id="distance" class="distance"></div>
            <div id="source" class="source"></div>
          </div>
        </div>

        <div id="meta" class="meta" hidden>
          <div><span>DATE</span><b id="dateValue">-</b></div>
          <div><span>SOURCE</span><b id="sourceValue">-</b></div>
          <div><span>RELATION</span><b id="relationValue">-</b></div>
        </div>

        <p id="message" class="message"></p>

        <div class="actions">
          <button id="nextImage" class="primary" type="button" hidden>次の記録</button>
          <button id="searchPlace" class="primary" type="button" hidden>この記録について検索する</button>
        </div>
      </div>
    </section>
  </main>
  <script src="./case.js"></script>
</body>
</html>
