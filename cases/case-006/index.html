<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CASE 006 | LAST SEARCH</title>
  <link rel="stylesheet" href="./case.css?v=20260822e">
</head>
<body>
  <main class="shell" id="shell">
    <section class="search-stage" id="searchStage">
      <div class="case-label">CASE 006</div>
      <h1>探しますか？</h1>

      <form id="searchForm" class="search-form" autocomplete="off">
        <input
          id="searchInput"
          type="search"
          inputmode="search"
          placeholder="検索語を入力"
          aria-label="検索語"
          maxlength="80"
        >
        <button type="submit">検索</button>
      </form>

      <p class="hint">入力内容に応じて処理を開始します。</p>
    </section>

    <section class="trace-stage hidden" id="traceStage" aria-live="polite">
      <div class="trace-head">
        <span>LAST SEARCH / TRACKING SESSION</span>
        <span class="blink-dot"></span>
      </div>

      <div class="status-box">
        <div class="status-text" id="statusText">待機中</div>
        <div class="progress-wrap hidden" id="progressWrap">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-num" id="progressNum">0%</div>
        </div>
      </div>

      <div class="gallery" id="gallery">
        <figure class="camera-card hidden" id="cam1">
          <img src="./img/track-01.webp" alt="防犯カメラ記録1">
          <figcaption>CAMERA SOURCE 01 / MATCH</figcaption>
        </figure>

        <figure class="camera-card hidden" id="cam2">
          <img src="./img/track-02.webp" alt="防犯カメラ記録2">
          <figcaption>CAMERA SOURCE 02 / MATCH</figcaption>
        </figure>

        <figure class="camera-card hidden" id="cam3">
          <img src="./img/track-03.webp" alt="防犯カメラ記録3">
          <figcaption>CAMERA SOURCE 03 / MATCH</figcaption>
        </figure>

        <figure class="camera-card hidden" id="cam4">
          <img src="./img/track-04.webp" alt="防犯カメラ記録4">
          <figcaption>CAMERA SOURCE 04 / MATCH</figcaption>
        </figure>

        <div class="camera-card error-card hidden" id="cam5Error">
          <div class="error-noise"></div>
          <div class="error-copy">
            <strong>IMAGE DATA ERROR</strong>
            <span>SOURCE 05</span>
            <span>ACCESS RESTRICTED</span>
            <span>FRAME UNAVAILABLE</span>
          </div>
        </div>

        <figure class="camera-card hidden" id="cam5">
          <img src="./img/track-05.webp" alt="防犯カメラ記録5">
          <figcaption>FIRE ALARM / NETWORK CAMERA SOURCE / MATCH</figcaption>
        </figure>
      </div>

      <div class="event-log" id="eventLog"></div>
    </section>
  </main>

  <section class="blackout hidden" id="blackout" aria-live="assertive">
    <div class="blackout-inner">
      <div class="blackout-line" id="blackoutLine"></div>
      <div class="death hidden" id="deathText">久我あきら　死亡</div>
    </div>
  </section>

  <script src="./case.js?v=20260822e"></script>
</body>
</html>
