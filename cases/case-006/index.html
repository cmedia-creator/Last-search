<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<title>LAST SEARCH</title>
<link rel="stylesheet" href="./case.css">
</head>
<body>
<main class="page">
  <header>
    <div class="logo">LAST SEARCH</div>
    <div class="crumb">保存データ / 位置記録 / 未分類</div>
  </header>

  <section class="card">
    <h1>位置記録 / 未分類</h1>
    <p class="lead">撮影地点情報を含む保存データ。</p>

    <figure>
      <img id="photo" src="./img/distance-01.png" alt="">
    </figure>

    <dl class="meta">
      <div><dt>撮影日時</dt><dd id="date">2026/08/14</dd></div>
      <div><dt>撮影地点</dt><dd id="place" hidden></dd></div>
      <div><dt>距離</dt><dd id="distance">312m</dd></div>
      <div id="personRow" hidden><dt>関連人物</dt><dd>久我あきら</dd></div>
    </dl>

    <button id="nextBtn" type="button">次の記録</button>
    <button id="searchPlaceBtn" type="button" hidden>この場所について検索する</button>
  </section>
</main>
<script src="./case.js"></script>
</body>
</html>
