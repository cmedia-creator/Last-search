<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>CASE 012 | CHAT ROOM</title>
  <link rel="stylesheet" href="./case.css?v=20260822c12">
</head>
<body>
  <main class="shell">
    <header class="room-head">
      <div>
        <div class="eyebrow">LAST SEARCH / PRIVATE ROOM</div>
        <div class="room-title">CHAT ROOM</div>
      </div>
      <div class="case-no">CASE 012</div>
    </header>

    <section class="board" id="board" aria-live="polite">
      <div class="system-line">チャットルームに入室しました。</div>
    </section>

    <form class="input-area" id="chatForm" autocomplete="off">
      <label for="chatInput">コメント</label>
      <div class="input-row">
        <input
          id="chatInput"
          type="text"
          maxlength="120"
          placeholder="コメントを入力"
          disabled
          autocomplete="off"
        >
        <button type="submit" id="sendBtn" disabled>送信</button>
      </div>
      <div class="input-state" id="inputState"></div>
    </form>
  </main>

  <script src="./case.js?v=20260822c12"></script>
</body>
</html>
