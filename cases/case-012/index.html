<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<title>CASE 012 | LAST SEARCH</title>
<link rel="stylesheet" href="./case.css">
</head>
<body>
<main class="page">
<section class="panel" id="panel">
<header class="head"><div class="brand">LAST SEARCH</div><div class="case-no">CASE 012</div></header>
<div class="content">
<p class="eyebrow">LAST KNOWN LOCATION / 31 PERSONS</p>
<h1>見つからない場所</h1>
<p class="intro">31名の最後の位置を重ねています。</p>

<div class="map" id="map">
  <div class="roads r1"></div><div class="roads r2"></div><div class="roads r3"></div>
  <div id="points"></div>
  <div class="target"></div>
  <div class="map-label">位置情報</div>
</div>

<div id="countBox" class="count-box">
  <span>確認できる人物</span><strong id="count">31</strong>
</div>

<div id="searchStage" class="search-stage" hidden>
  <div class="search-logo">LAST SEARCH</div>
  <div id="searchRows"></div>
</div>

<div id="oneResult" class="one-result" hidden>
  <span>検索結果</span><strong>1件</strong>
</div>

<div id="finalMessage" class="final-message" hidden>ここには来ないでください。</div>

<p id="message" class="message">位置情報を確認しています。</p>
<button id="openResult" class="primary" hidden>1件の結果を開く</button>
<button id="finish" class="primary" hidden>検索を終了する</button>
</div>
</section>
</main>

<div id="ending" class="ending" hidden>
 <div class="ending-inner">
  <div class="ending-brand">LAST SEARCH</div>
  <p id="end1">検索を終了します。</p>
  <p id="end2" hidden>あなたへ真実を伝えます</p>
  <small id="end3" hidden>FREE INVESTIGATION RECORD / END</small>
 </div>
</div>
<script src="./case.js"></script>
</body>
</html>
