<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F4F4F1">
  <title>CASE 004 | LAST SEARCH</title>
  <link rel="stylesheet" href="./case.css">
</head>
<body>
  <main class="page">
    <section class="panel" aria-live="polite">
      <header class="head">
        <div class="brand">LAST SEARCH</div>
        <div class="case-no">CASE 004</div>
      </header>

      <div class="content">
        <p class="eyebrow">人物検索</p>

        <div class="person">
          <div class="portrait-wrap">
            <img src="./img/kuga-main.webp" alt="" class="portrait">
          </div>

          <div class="person-main">
            <h1>久我あきら</h1>
            <p class="meta">31歳 / 個人開発者</p>
          </div>
        </div>

        <dl class="record">
          <div>
            <dt>主な記録</dt>
            <dd>検索システム「Z Search」開発</dd>
          </div>
          <div>
            <dt>最終確認</dt>
            <dd id="lastSeen">2026年 / 記録停止</dd>
          </div>
          <div>
            <dt>所在</dt>
            <dd id="location">確認できません</dd>
          </div>
          <div>
            <dt>状態</dt>
            <dd id="status">照合中</dd>
          </div>
        </dl>

        <div id="basis" class="basis" hidden>
          <p class="basis-title">判定情報</p>
          <div class="basis-row"><span>通信記録</span><b>更新なし</b></div>
          <div class="basis-row"><span>金融記録</span><b>更新なし</b></div>
          <div class="basis-row"><span>医療記録</span><b>更新なし</b></div>
          <div class="basis-row"><span>所在記録</span><b>確認不能</b></div>
        </div>

        <p id="message" class="message">人物情報を照合しています。</p>

        <button id="detailButton" class="secondary" type="button" hidden>判定情報を表示</button>
        <button id="nextButton" class="primary" type="button" hidden>Z Searchを検索する</button>
      </div>
    </section>
  </main>

  <script src="./case.js"></script>
</body>
</html>
