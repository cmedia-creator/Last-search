<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F4F4F1">
  <title>CASE 003 | LAST SEARCH</title>
  <link rel="stylesheet" href="./case.css">
</head>
<body>
  <main class="page">
    <section class="panel" id="panel" aria-live="polite">
      <header class="head">
        <div class="brand">LAST SEARCH</div>
        <div class="case-no">CASE 003</div>
      </header>
      <div class="content">
        <div class="code">404</div>
        <h1 id="title">ページが見つかりません。</h1>
        <p id="message" class="message">指定された記録を表示できませんでした。</p>

        <div id="detail" class="detail" hidden>
          <div class="row"><span>REQUEST</span><b id="requestValue">DIRECT</b></div>
          <div class="row"><span>SEARCH CONTEXT</span><b id="contextValue">NOT FOUND</b></div>
          <div class="row"><span>RECORD STATE</span><b id="recordValue">LOCKED</b></div>
        </div>

        <button id="backButton" class="primary" type="button" hidden>検索画面へ戻る</button>
      </div>
    </section>
  </main>
  <script src="./case.js"></script>
</body>
</html>
