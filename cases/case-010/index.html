<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>CASE 010 | LAST SEARCH</title>
  <link rel="stylesheet" href="./case.css?v=20260822t1">
</head>
<body>
  <main class="shell" id="shell">

    <section class="mail-view" id="mailView">
      <header class="mail-top">
        <div>
          <div class="system-label">公安内部通信 / 緊急配信</div>
          <div class="mail-title">一斉配信緊急メール</div>
        </div>
        <div class="case-no">CASE 010</div>
      </header>

      <article class="mail-card">
        <div class="mail-row">
          <span class="mail-key">From：</span>
          <span>暗号化技術により秘匿されています</span>
        </div>
        <div class="mail-row">
          <span class="mail-key">件名：</span>
          <strong>一斉配信緊急メール / 第17号</strong>
        </div>

        <div class="mail-body">
          <p class="emergency">※※これは訓練ではない※※</p>

          <p>
            本日 <strong id="currentTime">--時--分</strong><br>
            電脳偏在体 <strong>OGOTAKA - おごたか</strong> による活動を確認。
          </p>

          <p class="order">捜査員はただちに接続元を特定せよ。</p>
        </div>
      </article>

      <div class="danger-box" id="dangerBox">
        <strong>危険：ただちにブラウザを閉じてください。</strong>
        <span>セキュリティソフトが機能しません</span>
      </div>
    </section>

    <section class="analysis-view hidden" id="analysisView" aria-live="polite">
      <header class="analysis-head">
        <span>NETWORK TRACE / OGOTAKA</span>
        <span class="live">LIVE</span>
      </header>

      <div class="analysis-panel">
        <div class="analysis-status" id="analysisStatus">待機中</div>

        <div class="progress-wrap hidden" id="progressWrap">
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-value" id="progressValue">0%</div>
        </div>

        <div class="node-field" id="nodeField"></div>
        <div class="trace-log" id="traceLog"></div>
      </div>
    </section>

  </main>

  <section class="crash hidden" id="crash" aria-live="assertive">
    <div class="crash-noise"></div>
    <div class="crash-content">
      <div class="crash-code" id="crashCode"></div>
      <div class="crash-title" id="crashTitle">SERVER CRASH</div>
    </div>
  </section>

  <script src="./case.js?v=20260822t1"></script>
</body>
</html>
