<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<title>CASE 010 | LAST SEARCH</title>
<link rel="stylesheet" href="./case.css">
</head>
<body>
<main class="page">
<section class="panel" id="panel">
<header class="head"><div class="brand">LAST SEARCH</div><div class="case-no">CASE 010</div></header>
<div class="content">
<p class="eyebrow">RECOVERED RECORD / 2009.09.14 - 2009.09.17</p>
<h1>OFFLINE</h1>
<p class="intro">一家4名に関連する削除済み記録を復元しています。</p>

<div class="device">
  <div class="phone-top">2009/09/17</div>
  <div id="cards" class="cards">
    <div class="card" data-step="0"><span class="icon">TEL</span><div><b>携帯電話</b><small id="v0">契約中</small></div></div>
    <div class="card" data-step="1"><span class="icon">@</span><div><b>メール</b><small id="v1">利用中</small></div></div>
    <div class="card" data-step="2"><span class="icon">SNS</span><div><b>アカウント</b><small id="v2">表示可能</small></div></div>
    <div class="card" data-step="3"><span class="icon">GPS</span><div><b>位置情報</b><small id="v3">取得可能</small></div></div>
    <div class="card" data-step="4"><span class="icon">ID</span><div><b>人物照合</b><small id="v4">4名を検出</small></div></div>
  </div>
</div>

<div id="searchStage" class="search-stage" hidden>
  <span>最後に残った検索</span>
  <div class="search-field"><b id="query"></b><i id="cursor">|</i></div>
</div>

<div id="finalBox" class="final-box" hidden>
  <p>2009/09/17 03:12</p>
  <strong>オンライン記録がありません。</strong>
</div>

<p id="message" class="message">復元を開始します。</p>
<button id="next" class="primary" hidden>久我あきらの記録を確認する</button>
</div>
</section>
</main>
<script src="./case.js"></script>
</body>
</html>
